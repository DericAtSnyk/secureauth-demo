<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — SecureAuth Demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Change Password</h1>
    <p class="disclaimer">No CSRF token — intentionally vulnerable</p>

    <!-- CSRF-vulnerable form: no anti-CSRF token -->
    <form id="changeForm" action="/password-change" method="POST">
      <label for="userId">User ID</label>
      <input type="number" id="userId" name="userId" value="1" required>

      <label for="currentPassword">Current Password</label>
      <input type="password" id="currentPassword" name="currentPassword" required>

      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" name="newPassword" required minlength="6">

      <button type="submit">Change Password</button>
    </form>
    <p id="message"></p>
    <p><a href="/">Back</a></p>
  </div>
  <script>
    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/password-change', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: document.getElementById('userId').value,
          currentPassword: document.getElementById('currentPassword').value,
          newPassword: document.getElementById('newPassword').value,
        }),
      });
      const data = await res.json();
      const msg = document.getElementById('message');
      msg.textContent = data.message || data.error;
      msg.className = res.ok ? 'success' : 'error';
    });
  </script>
</body>
</html>
