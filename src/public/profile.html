<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — SecureAuth Demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Profile</h1>
    <label for="userId">User ID (try another user's ID)</label>
    <input type="number" id="userId" value="1">

    <button id="loadProfile">Load Profile</button>
    <button id="loadView">Load HTML View</button>

    <pre id="output"></pre>
    <div id="htmlView"></div>

    <section>
      <h2>Set Avatar from URL</h2>
      <input type="url" id="avatarUrl" placeholder="https://example.com/avatar.png">
      <button id="setAvatar">Fetch & Set Avatar</button>
    </section>

    <p><a href="/">Back</a></p>
  </div>
  <script>
    function authHeaders() {
      const token = localStorage.getItem('token');
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    document.getElementById('loadProfile').addEventListener('click', async () => {
      const userId = document.getElementById('userId').value;
      const res = await fetch(`/profile?userId=${userId}`, { headers: authHeaders() });
      document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
    });

    document.getElementById('loadView').addEventListener('click', async () => {
      const userId = document.getElementById('userId').value;
      const res = await fetch(`/profile/view?userId=${userId}`, { headers: authHeaders() });
      document.getElementById('htmlView').innerHTML = await res.text();
    });

    document.getElementById('setAvatar').addEventListener('click', async () => {
      const res = await fetch('/profile/avatar', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ avatarUrl: document.getElementById('avatarUrl').value }),
      });
      document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
    });
  </script>
</body>
</html>
